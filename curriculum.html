<!--우리학교 편제표 : 학년별 개별 선택과목을 임시로 선택해보는 폼-->
<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="2026드림팀">
        <title>선택과목 가이드</title>
        <link rel="stylesheet" href="curriculum.css">
    </head>
    <body>
        <script src="data.js"></script>
        <script src="curriculum.js" defer></script>

        <p id="grade-label">학년: <strong id="grade-value">-</strong></p>
        <h4>우리학교 편제표</h4>
        
        <div id="controls-row">
            <div id="term-selector">
                <label for="term-select">학기 선택:</label>
                <select id="term-select">
                    <option value="1학기">1학기</option>
                    <option value="2학기">2학기</option>
                </select>
            </div>
            
            <div id="legend">
                <span class="legend-item"><span class="legend-abs">절대과목</span> 빨간색 글자</span>
                <span class="legend-item"><span class="legend-social">사회과목</span> 노란 배경</span>
                <span class="legend-item"><span class="legend-science">과학과목</span> 파란 배경</span>
            </div>
        </div>

        <form id="curriculum-form">
            <!-- data.js의 CURRICULUM으로 curriculum.js가 질문을 채운다 -->
        </form>

        <div id="footer-bar">
            <span id="pick-status"></span>
            <button type="button" id="save-button">임시 선택 저장</button>
        </div>
    </body>
</html>
