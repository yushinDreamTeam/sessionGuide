<!--우리학교 편제표 : 학년별 개별 선택과목을 임시로 선택해보는 폼-->
<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="2026드림팀">
        <title>선택과목 가이드</title>
        <link rel="stylesheet" href="curriculum.css">
    </head>
    <body>
        <header class="page-top-banner">
            <span class="page-top-badge">유신고 · 2026 드림팀</span>
            <p class="page-developer-list">
                <span class="page-developer-role">팀장</span>
                <span class="page-developer-name">최진형</span>
                <span class="page-developer-role">팀원</span>
                <span class="page-developer-name">이성빈, 나지환, 박영현, 장재호</span>
            </p>
        </header>

        <script src="data.js"></script>
        <script src="curriculum.js" defer></script>

        <div class="title-row">
            <h4>우리학교 편제표</h4>
            <div class="title-controls">
                <div id="grade-selector" class="header-grade-selector">
                    <select id="grade-select">
                        <option value="2학년">2학년(현재 1학년)</option>
                        <option value="3학년">3학년(현재 2학년)</option>
                    </select>
                </div>
                <div id="term-selector" class="header-term-selector">
                    <select id="term-select">
                        <option value="전체">전체</option>
                        <option value="1학기">1학기</option>
                        <option value="2학기">2학기</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="legend">
            <span class="legend-item"><span class="legend-abs">절대과목</span> 빨간색 글자</span>
            <span class="legend-item"><span class="legend-social">사회과목</span> 노란 배경</span>
            <span class="legend-item"><span class="legend-science">과학과목</span> 파란 배경</span>
        </div>

        <form id="curriculum-form">
            <!-- data.js의 CURRICULUM으로 curriculum.js가 질문을 채운다 -->
        </form>

        <div id="footer-bar">
            <span id="pick-status"></span>
            <button type="button" id="save-button">임시 선택 저장</button>
        </div>
    </body>
</html>
