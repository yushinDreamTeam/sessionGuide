<!--진로가 명확하지 않은 애들 화면-->
<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="2026드림팀">
        <title>선택과목 가이드</title>
        <link rel="stylesheet" href="unfocused.css">
    </head>
    <body>
        <!-- data.js를 먼저 불러온 뒤 unfocused.js가 사용한다 -->
        <script src="data.js"></script>
        <script src="unfocused.js" defer></script>

        <p id="grade-label">학년: <strong id="grade-value">-</strong></p>

        <div class="title-row">
            <h4>계열별 주요 권장과목</h4>
            <div id="term-selector" class="header-term-selector">
                <select id="semester-select">
                    <option value="전체">전체</option>
                    <option value="1학기">1학기</option>
                    <option value="2학기">2학기</option>
                </select>
            </div>
        </div>

        <div class="legend" aria-label="과목 범례">
            <span class="legend-item"><span class="legend-abs">절대과목</span> 빨간색 글자</span>
            <span class="legend-item"><span class="legend-social">사회과목</span> 노란 배경</span>
            <span class="legend-item"><span class="legend-science">과학과목</span> 파란 배경</span>
        </div>

        <!--계열 탭 : data.js의 FACULTIES로 unfocused.js가 채운다-->
        <div id="discipline-tabs"></div>

        <div id="view-result">
            <p id="result-summary"></p>
            <div id="subjects-recommend">
                <!-- 각 과목 한 줄:  과목명 | 권장학교 N개 | 세부정보(i) -->
            </div>
        </div>

        <!--세부정보 팝업 (기본 숨김)-->
        <div id="modal-overlay" hidden>
            <div id="modal" role="dialog" aria-modal="true">
                <button type="button" id="modal-close" aria-label="닫기">&times;</button>
                <h4 id="modal-title">과목명</h4>
                <p id="modal-subtitle">이 과목을 권장/핵심으로 고른 대학·학과</p>
                <ul id="modal-school-list">
                    <!-- 학교로고 | 학교명 | 학과명 -->
                </ul>
            </div>
        </div>
    </body>
</html>
